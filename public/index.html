<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Zytron Share</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0 0 8px 0;
    }
    p {
      color: #9ca3af;
      font-size: 0.875rem;
      margin: 0;
    }
  </style>
  <script>
    window.location.replace("https://zytron-share.vercel.app");
  </script>
</head>
<body>
  <div class="loader"></div>
  <h1>Zytron Share</h1>
  <p>Verbinden met beveiligd mesh netwerk...</p>
</body>
</html>
