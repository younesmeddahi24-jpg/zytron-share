name: Build Zytron Share Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/zytron-share.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zytron-share-apk
          path: build-output/zytron-share.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "Zytron Share v1.0 Native Android APK"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # 🚀 Zytron Share — Echte Native Android App

            De officiële native Android APK voor **Zytron Share**.
            
            ### 📱 Hoe te installeren op je Samsung / Android telefoon:
            1. Tik hieronder bij **Assets** op **`zytron-share.apk`** om het bestand te downloaden.
            2. Open het gedownloade bestand en kies **Installeren**.
            3. Geef toestemming voor Bluetooth & Apparaten in de buurt wanneer daarom wordt gevraagd.
            
            ### ⚡ Exclusieve Native Voordelen:
            - **Achtergrond Scanning**: Blijft apparaten in de buurt scannen en vinden, zelfs als je YouTube Shorts kijkt of de telefoon vergrendeld is.
            - **10-Minuten Iedereen Modus**: AirDrop / Quick Share functionaliteit die na 10 minuten automatisch uitschakelt voor batterijbesparing.
            - **Directe P2P WebRTC dataoverdracht**: Supersnelle overdracht via lokaal netwerk / hotspot zonder bestandsgrootte-limieten.
          files: build-output/zytron-share.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
